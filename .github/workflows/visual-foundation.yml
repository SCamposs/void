name: Visual foundation validation
on:
  push:
    branches: [main, 'mind-visual-foundation']
    paths: ['desktop/**', '.github/workflows/visual-foundation.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/visual-foundation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-foundation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - name: Use the official Ubuntu archive directly
        run: |
          # Resolve only the archive host for this ephemeral, credential-free runner.
          ubuntu_archive_ip="$(timeout 15s getent ahostsv4 archive.ubuntu.com | awk 'NR == 1 {print $1}' || true)"
          if [ -z "$ubuntu_archive_ip" ]; then
            ubuntu_archive_ip="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 --resolve dns.google:443:8.8.8.8 'https://dns.google/resolve?name=archive.ubuntu.com&type=A&edns_client_subnet=0.0.0.0/0' | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["Status"] == 0, "Archive DNS query status: " + str(r["Status"]); print(next(a["data"] for a in r["Answer"] if a.get("type") == 1))')"
          fi
          UBUNTU_ARCHIVE_IP="$ubuntu_archive_ip" python3 -c 'import ipaddress,os; a=ipaddress.ip_address(os.environ["UBUNTU_ARCHIVE_IP"]); assert a.version == 4 and a.is_global, "Archive DNS did not return a public IPv4 address"'
          printf '%s archive.ubuntu.com\n' "$ubuntu_archive_ip" | sudo tee -a /etc/hosts > /dev/null
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: visual-foundation-evidence
          path: |
            desktop/test-results/
            desktop/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
  native-windows:
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build branded NSIS candidate without publishing
        run: npm run tauri -- build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: VOID-visual-foundation-Windows-candidate
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 7
          if-no-files-found: error
