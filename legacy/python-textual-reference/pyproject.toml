[project]
name = "void"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "sqlmodel>=0.0.38",
    "textual>=8.2.7",
    "typer>=0.25.1",
]

[project.scripts]
void = "void.cli:app"
void-ui = "void.cli:ui_main"
json-format = "void.cli:json_format_main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/void"]
